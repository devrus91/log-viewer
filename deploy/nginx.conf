# Build the site with `npm ci && npm run build`, then place the repository at
# /var/www/log-viewer. This file is intended for /etc/nginx/conf.d/ or
# /etc/nginx/sites-enabled/ and therefore contains only the server block.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/log-viewer/out;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Next.js adds content hashes to these files, so they can be cached forever.
    location /_next/static/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The export uses trailing-slash routes (for example, /about/index.html).
    # Do not fall back to index.html: unknown routes should remain real 404s.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;
}
